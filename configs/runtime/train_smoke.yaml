seed: 42
batch_size: 8
num_workers: 8
epochs: 2                       # smoke test: just confirm the pipeline + artifacts
learning_rate: 0.0001
weight_decay: 0.0001
device: cuda
segment_seconds: 30
save_dir: outputs
grad_clip: 1.0
early_stopping_patience: 5
balanced_sampling: true
balanced_val: true
make_reports: true
confusion_max_per_class: 200    # tiny train-confusion subset for a fast smoke run
limit_batches: 20               # cap steps/epoch and confusion inference for a ~minutes-long smoke run
