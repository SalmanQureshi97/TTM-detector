seed: 42
sample_rate: 16000
segment_seconds: 120
batch_size: 2                    # full fine-tune is memory-heavy at 120 s
num_workers: 4
amp: true                        # required for full fine-tune
epochs: 50
early_stopping_patience: 10
device: cuda
save_dir: outputs
grad_clip: 5.0

balanced_sampling: true
balanced_val: true
make_reports: true
confusion_max_per_class: null

# --- Anti-overfitting changes ---
# Lower LR than the head-only run because the backbone is now unfrozen;
# a high LR would tear apart SONICS' pretrained features on step 1.
learning_rate: 0.00005
weight_decay: 0.05

# --- Convergence-stability additions (2025-07-01) ---
# Gradient accumulation: forward+backward 64 mini-batches of size 2 before
# stepping the optimizer, giving an effective batch of 128 (matching what
# SONICS' upstream pretraining used). Without this, Adam's optimizer state
# is updated from batch-2 statistics which are essentially noise for an
# 18M-param backbone.
grad_accum_steps: 64

# Linear LR warmup for the first 5 epochs, ramping from warmup_lr to
# learning_rate, then cosine-decay for the remaining 45 epochs. The
# freshly-initialised four-class head would otherwise flow huge random
# gradients into the pretrained backbone on step 1 at full LR.
warmup_epochs: 5
warmup_lr: 0.000001
