name: c4_sonics_fakemusiccaps
notation: C4
description: Adds fake-generator diversity by combining SONICS and FakeMusicCaps.
study_question: Measures whether generator diversity improves transfer to unseen real+encoded material.
train_datasets: [SONICS, FakeMusicCaps]
val_datasets: [SONICS, FakeMusicCaps]
available_suites: [S1, S2, S3, S4, S5, S6]
test_suites:
  - id: S1
    name: in_domain_holdout
    datasets: [SONICS, FakeMusicCaps]
    split: test
    purpose: Standard within-domain performance on the SONICS + FakeMusicCaps configuration.
  - id: S2
    name: sonics_holdout
    datasets: [SONICS]
    split: test
    purpose: SONICS-only view for direct comparison with SONICS-native performance.
  - id: S3
    name: fma_holdout
    datasets: [FMA]
    split: test
    purpose: Transfer to human-created real and real+encoded audio from FMA.
  - id: S4
    name: union_holdout
    datasets: [FMA, SONICS, FakeMusicCaps]
    split: test
    purpose: Evaluate against the pooled test set across all known domains.
advanced_suites:
  - id: S5
    name: generator_holdout
    mode: requires_generator_specific_retraining
    purpose: Hold out one generator family during training and test only on that family.
  - id: S6
    name: encoder_holdout
    mode: requires_encoder_specific_retraining
    purpose: Hold out one encoder family during training and test only on that encoder.
