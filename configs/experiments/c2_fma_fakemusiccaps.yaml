name: c2_fma_fakemusiccaps
notation: C2
description: Complementary two-dataset setup using FMA for real data and FakeMusicCaps for fake data.
study_question: Measures whether complementary real/fake domains transfer to SONICS.
train_datasets: [FMA, FakeMusicCaps]
val_datasets: [FMA, FakeMusicCaps]
available_suites: [S1, S2, S3, S4, S5, S6]
test_suites:
  - id: S1
    name: in_domain_holdout
    datasets: [FMA, FakeMusicCaps]
    split: test
    purpose: Standard within-domain performance on the complementary FMA + FakeMusicCaps setup.
  - id: S2
    name: sonics_holdout
    datasets: [SONICS]
    split: test
    purpose: Transfer to SONICS as a modern end-to-end song benchmark.
  - id: S4
    name: union_holdout
    datasets: [FMA, SONICS, FakeMusicCaps]
    split: test
    purpose: Evaluate against the pooled test set across all known domains.
advanced_suites:
  - id: S3
    name: fma_fmc_holdout
    note: Equivalent to S1 for C2 since training is FMA + FakeMusicCaps.
  - id: S5
    name: generator_holdout
    mode: requires_generator_specific_retraining
    purpose: Hold out one generator family during training and test only on that family.
  - id: S6
    name: encoder_holdout
    mode: requires_encoder_specific_retraining
    purpose: Hold out one encoder family during training and test only on that encoder.
