name: deezer_speccnn_amplitude_robust
family: cnn

# Same architecture as deezer_speccnn_amplitude.yaml; the addition is a
# light-policy SpecAugment block. Combined with the train_robust.yaml
# runtime (weight_decay=0.05) and four_class_flat_smooth.yaml task
# (label_smoothing=0.02) this is the anti-overfitting variant.

frontend:
  type: deezer_amplitude
  sample_rate: 44100
  n_fft: 2048
  hop_length: 512
  hf_cut: 16000
  normalize_mean: -4.0
  normalize_std: 3.0

backbone:
  type: speccnn
  channels: [128, 128, 256, 256, 512, 512]
  strides: [1, 3, 3, 3, 3, 3]
  kernel_sizes: [3, 3, 3, 3, 3, 3]
  head_dim: 64

augment:
  type: spec_augment
  # Light "LB"-style policy: small magnitudes and only applied half the
  # time. This was previously too aggressive in the LD-policy variant.
  freq_mask_param: 27        # up to 27 / 743 ~= 3.6% of the freq axis
  n_freq_masks: 1
  time_mask_param: 70        # up to 70 / 2580 ~= 2.7% of the time axis
  n_time_masks: 1
  p: 0.5                     # apply on half the training steps
  mask_value: 0.0
