name: sonics_spectttra_alpha120s_mlp_head
family: transformer

# Same backbone as the linear-probe variant, but with a richer MLP classifier
# on top -- still frozen backbone, so we're testing whether the linear-probe
# bottleneck was *capacity* (a linear projection wasn't expressive enough)
# vs *feature quality* (SpecTTTra's pretrained representation doesn't have
# the four-class decomposition in it linearly separable).

frontend:
  type: logmel
  sample_rate: 16000
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  n_mels: 128
  f_min: 20
  f_max: 8000
  power: 2
  top_db: 80
  norm: mean_std

backbone:
  type: spectttra
  pretrained_weights: pretrained/sonics-spectttra-alpha-120s.bin
  freeze: true                  # backbone still frozen
  input_shape: [128, 3744]
  embed_dim: 384
  num_heads: 6
  num_layers: 12
  t_clip: 3
  f_clip: 1
  mlp_ratio: 2.67
  pe_learnable: true
  pre_norm: true
  attn_drop_rate: 0.1
  pos_drop_rate: 0.1
  proj_drop_rate: 0.0

# Trainable head: 384 -> 256 -> 4 with GELU + dropout (~99k trainable params,
# vs 1,540 for the linear probe).
head:
  hidden_dim: 256
  dropout: 0.1
