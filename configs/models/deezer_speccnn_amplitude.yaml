name: deezer_speccnn_amplitude
family: cnn
frontend:
  type: deezer_amplitude
  sample_rate: 44100
  n_fft: 2048
  hop_length: 512
  hf_cut: 16000
  normalize_mean: -4.0
  normalize_std: 3.0
backbone:
  type: speccnn
  channels: [128, 128, 256, 256, 512, 512]
  strides: [1, 3, 3, 3, 3, 3]
  kernel_sizes: [3, 3, 3, 3, 3, 3]
  head_dim: 64
